<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Examen ETS - ESCOM IPN</title>
    <link rel="icon" type="image/svg+xml" href="../../recursos/imagenes/tiburon.svg">
    <link rel="stylesheet" href="../../recursos/css/estilos_busqueda.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Crete+Round:ital@0;1&family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>

    <header class="encabezado_nuevo">
        <div class="contenedor_nav_superior">
            <div class="logo_titulo">
                <div class="icono_logo">
                    <i class="fa-solid fa-pen-to-square"></i>
                </div>
                <h1>Editar Examen</h1>
            </div>
            <nav class="navegacion_superior">
                <a href="dashboard.html">Volver al Panel</a>
            </nav>
        </div>
    </header>

    <main class="contenedor_principal_nuevo" style="padding-top: 3rem;">
        <section class="tarjeta_formulario">
            <h2 class="titulo_seccion" style="text-align: center; color: var(--color_azul_oscuro); border-bottom: none; margin-bottom: 2rem;">Editar Datos del Examen</h2>

            <div id="mensaje_alerta" class="control_formulario" style="display: none; margin-bottom: 1.5rem; text-align: center; font-weight: 600;"></div>

            <form id="formulario_editar_examen" novalidate>
                <div class="formulario_filtros" style="flex-direction: column; align-items: stretch; gap: 1rem;">
                    
                    <div class="grupo_campo">
                        <label for="select_carrera">Carrera:</label>
                        <select id="select_carrera" class="control_formulario" required>
                            <option value="0">Seleccione una carrera...</option>
                        </select>
                    </div>

                    <div class="grupo_campo">
                        <label for="select_materia">Unidad de Aprendizaje (Materia):</label>
                        <select id="select_materia" class="control_formulario" disabled required>
                            <option value="0">Seleccione una materia...</option>
                        </select>
                    </div>

                    <div class="grupo_campo">
                        <label for="input_fecha">Fecha de Aplicación:</label>
                        <input type="text" id="input_fecha" class="control_formulario" placeholder="DD/MM/AAAA" required>
                    </div>

                    <div class="grupo_campo" style="display: flex; gap: 1rem;">
                        <div style="flex: 1;">
                            <label for="select_hora_manana">Horario Mañana (Inicio):</label>
                            <select id="select_hora_manana" class="control_formulario" required>
                                <option value="08:00:00">08:00 hrs</option>
                                <option value="09:00:00">09:00 hrs</option>
                                <option value="10:00:00">10:00 hrs</option>
                                <option value="11:00:00">11:00 hrs</option>
                                <option value="12:00:00">12:00 hrs</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <label for="select_hora_tarde">Horario Tarde (Inicio):</label>
                            <select id="select_hora_tarde" class="control_formulario" required>
                                <option value="13:00:00">13:00 hrs</option>
                                <option value="14:00:00">14:00 hrs</option>
                                <option value="15:00:00">15:00 hrs</option>
                                <option value="16:00:00">16:00 hrs</option>
                                <option value="17:00:00">17:00 hrs</option>
                            </select>
                        </div>
                    </div>

                    <div class="grupo_campo">
                        <label for="select_profesor">Profesor Coordinador:</label>
                        <select id="select_profesor" class="control_formulario" required>
                            <option value="0">Seleccione un profesor...</option>
                        </select>
                    </div>

                    <div class="grupo_campo" style="display: flex; gap: 1rem;">
                        <div style="flex: 1;">
                            <label for="select_edificio">Edificio:</label>
                            <select id="select_edificio" class="control_formulario" required>
                                <option value="">Seleccione...</option>
                                <option value="1">Edificio 1</option>
                                <option value="2">Edificio 2</option>
                                <option value="3">Edificio 3</option>
                                <option value="4">Edificio 4</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <label for="select_piso">Piso / Nivel:</label>
                            <select id="select_piso" class="control_formulario" disabled required>
                                <option value="">Seleccione edificio...</option>
                                <option value="0">Planta Baja (0)</option>
                                <option value="1">Primer Piso (1)</option>
                                <option value="2">Segundo Piso (2)</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <label for="select_salon_final">Aula / Laboratorio:</label>
                            <select id="select_salon_final" class="control_formulario" disabled required>
                                <option value="">Seleccione piso...</option>
                            </select>
                        </div>
                    </div>

                    <div class="acciones_formulario" style="display: flex; gap: 1rem; margin-top: 1rem;">
                        <a href="dashboard.html" class="boton_exportar" style="text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: auto; margin: 0;">
                            <i class="fa-solid fa-xmark"></i> Cancelar
                        </a>
                        <button type="submit" class="boton_exportar" style="width: auto; margin: 0; background-color: var(--color_blue_900); color: white; border-color: var(--color_blue_900);">
                            <i class="fa-solid fa-pen-to-square"></i> Actualizar Cambios
                        </button>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <footer class="pie_pagina">
        <p>&copy; 2026 - Sistema de Gestión de ETS - ESCOM IPN</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>
    <script type="module" src="../../recursos/js/controladores/controlador_editar_examen.js"></script>
</body>
</html>
