<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - ESCOM IPN</title>
    <link rel="stylesheet" href="../../recursos/css/estilos_busqueda.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Crete+Round:ital@0;1&family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="encabezado_admin">
        <div class="contenedor_encabezado">
            <h1>Panel de Control Administrativo</h1>
            <p id="texto_bienvenida_usuario">Cargando administrador...</p>
        </div>
        <div class="logo_admin" style="font-size: 2rem; opacity: 0.8;">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
    </header>

    <main class="contenedor_principal">
        <div class="toolbar_admin">
            <div class="info_toolbar">
                <h2>Gestión Global del Sistema</h2>
                <p style="color: var(--color_texto_secundario); font-size: 0.95rem; margin: 0;">Administra altas, bajas y cambios en los exámenes ETS.</p>
            </div>
            <div class="acciones_toolbar">
                <a href="crear_examen.html" class="btn_guardar boton_primario" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px; width: auto; margin: 0;">
                    <i class="fa-solid fa-plus"></i> Agregar Examen
                </a>
                <button id="btn_cerrar_sesion" class="btn_cancelar boton_primario" style="display: inline-flex; align-items: center; gap: 8px; width: auto; margin: 0;">
                    <i class="fa-solid fa-right-from-bracket"></i> Salir
                </button>
            </div>
        </div>

        <section class="seccion_resultados" style="margin-bottom: 2rem; background-color: transparent; box-shadow: none; padding: 0;">
            <h2 class="titulo_seccion">Resumen Estadístico</h2>
            <div id="contenedor_estadisticas" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; margin-top: 1rem;"></div>
        </section>

        <section class="seccion_resultados">
            <h2 class="titulo_seccion">Listado de Exámenes Programados</h2>
            <div id="contenedor_tabla_examenes" style="background-color: #ffffff; padding: 1rem; border-radius: 8px; box-shadow: var(--sombra_suave); overflow-x: auto;"></div>
        </section>
    </main>

    <footer class="pie_pagina">
        <p>&copy; 2026 - Panel Administrativo Protegido - ESCOM IPN</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../../recursos/js/controladores/controlador_dashboard.js?v=4"></script>
</body>
</html>
