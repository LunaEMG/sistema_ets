<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - ESCOM IPN</title>
    <link rel="icon" type="image/svg+xml" href="../../recursos/imagenes/tiburon.svg">
    <link rel="stylesheet" href="../../recursos/css/estilos_busqueda.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Crete+Round:ital@0;1&family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <a href="#main_content" class="skip_link">Saltar al contenido principal</a>

    <header class="encabezado_nuevo">
        <div class="contenedor_nav_superior">
            <div class="logo_titulo">
                <div class="icono_logo">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1>Panel Administrativo</h1>
            </div>
            <nav class="navegacion_superior">
                <span id="texto_bienvenida_usuario" style="color: var(--color_blue_200); font-weight: 600;">...</span>
            </nav>
        </div>
    </header>

    <main id="main_content" class="contenedor_principal_nuevo">
        <div class="toolbar_admin_nuevo" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 4rem; margin-bottom: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1rem;">
                <div class="info_toolbar">
                    <h2 style="font-size: 1.875rem; font-weight: 800; color: var(--color_blue_950); margin-bottom: 0.25rem;">Gestión de Exámenes</h2>
                    <p style="color: var(--color_slate_500); font-size: 1rem; margin: 0;">Administra altas, bajas y cambios en los horarios programados.</p>
                </div>
                <div class="acciones_toolbar" style="display: flex; gap: 0.75rem;">
                    <a href="catalogos.html" class="boton_exportar de_pdf" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-list-check"></i> Catálogos
                    </a>
                    <a href="crear_examen.html" class="boton_exportar de_ics" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-plus"></i> Programar Examen
                    </a>
                    <button id="btn_cerrar_sesion" class="boton_exportar de_pdf" style="display: inline-flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-right-from-bracket"></i> Salir
                    </button>
                </div>
            </div>
        </div>

        <section class="seccion_resultados" style="margin-bottom: 2rem; background-color: transparent; box-shadow: none; padding: 0;">
            <h2 class="titulo_seccion">Resumen Estadístico</h2>
            <div id="contenedor_estadisticas" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; margin-top: 1rem;"></div>
        </section>

        <section class="seccion_resultados">
            <h2 class="titulo_seccion">Listado de Exámenes Programados</h2>
            
            <div class="barra_filtros" style="margin-bottom: 1.5rem;">
                <div class="titulo_filtros" style="flex: 1; min-width: 250px;">
                    <div class="contenedor_buscador_texto" style="margin: 0; max-width: 100%; box-shadow: none; border: 1px solid var(--color_gris_borde);">
                        <i class="fa-solid fa-search icono_buscador_texto" style="color: var(--color_slate_500);"></i>
                        <input type="text" id="input_buscador_texto" class="input_buscador_texto" placeholder="Buscar..." autocomplete="off" style="font-size: 0.9rem; padding: 0.8rem 1rem 0.8rem 3rem;">
                    </div>
                </div>
                
                <div class="contenedor_selectores">
                    <div class="grupo_selector">
                        <label for="select_carrera" class="sr-only">Seleccionar Carrera</label>
                        <i class="fa-solid fa-graduation-cap icono_selector" aria-hidden="true"></i>
                        <select id="select_carrera" class="control_selector">
                            <option value="0">Todas las carreras</option>
                        </select>
                    </div>

                    <div class="grupo_selector">
                        <label for="select_semestre" class="sr-only">Seleccionar Semestre</label>
                        <i class="fa-solid fa-list-ol icono_selector" aria-hidden="true"></i>
                        <select id="select_semestre" class="control_selector">
                            <option value="0">Todos los semestres</option>
                            <option value="1">1° Semestre</option>
                            <option value="2">2° Semestre</option>
                            <option value="3">3° Semestre</option>
                            <option value="4">4° Semestre</option>
                            <option value="5">5° Semestre</option>
                            <option value="6">6° Semestre</option>
                            <option value="7">7° Semestre</option>
                            <option value="8">8° Semestre</option>
                        </select>
                    </div>

                    <div class="grupo_selector">
                        <label for="select_materia" class="sr-only">Seleccionar Materia</label>
                        <i class="fa-solid fa-book icono_selector" aria-hidden="true"></i>
                        <select id="select_materia" class="control_selector" disabled>
                            <option value="0">Todas las materias</option>
                        </select>
                    </div>

                    <button id="btn_buscar" class="btn_buscar_nuevo" aria-label="Buscar exámenes">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <div id="contenedor_tabla_examenes" style="background-color: #ffffff; padding: 1rem; border-radius: 8px; box-shadow: var(--sombra_suave); overflow-x: auto;"></div>

        </section>
    </main>

    <footer class="pie_pagina">
        <p>&copy; 2026 - Panel Administrativo Protegido - ESCOM IPN</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../../recursos/js/controladores/controlador_dashboard.js?v=4"></script>
</body>
</html>
