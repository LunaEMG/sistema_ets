<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - ESCOM IPN</title>
    <link rel="icon" type="image/svg+xml" href="recursos/imagenes/tiburon.svg">
    <link rel="stylesheet" href="recursos/css/estilos_login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Crete+Round:ital@0;1&family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <main class="contenedor_login">
        <section class="tarjeta_login">
            <div class="login_encabezado">
                <i class="fa-solid fa-shield-halved logo_login"></i>
                <h2>Panel Administrativo</h2>
                <p>Ingrese sus credenciales de acceso oficial</p>
            </div>

            <div id="contenedor_mensaje_error" class="alerta_error oculta_mensaje"></div>

            <form id="formulario_login" novalidate>
                <div class="grupo_campo">
                    <label for="input_correo">Correo Electrónico:</label>
                    <div class="contenedor_input">
                        <input type="email" id="input_correo" class="control_formulario" placeholder="usuario@escom.ipn.mx" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>

                <div class="grupo_campo">
                    <label for="input_contrasena">Contraseña:</label>
                    <div class="contenedor_input">
                        <input type="password" id="input_contrasena" class="control_formulario" placeholder="••••••••" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <button type="submit" id="btn_entrar" class="boton_primario">
                    Iniciar Sesión <i class="fa-solid fa-arrow-right-to-bracket" style="margin-left: 8px;"></i>
                </button>
            </form>

            <div class="login_pie">
                <a href="index.html" class="enlace_regresar"><i class="fa-solid fa-arrow-left"></i> Volver al buscador público</a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="recursos/js/controladores/controlador_login.js"></script>

</body>
</html>
